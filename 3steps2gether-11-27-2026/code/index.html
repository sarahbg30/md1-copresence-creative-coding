<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3steps 2gether</title>
<!-- Added to the home screen of an iPhone or iPad, it opens on its own, with no Safari bars. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3steps 2gether">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* "Gaegu FR": Gaegu, with the accented letters it doesn't have (é, à, ç, ô,
     č, ř, ē…) taken from Patrick Hand, a close handwritten font, and Hindi's
     Devanagari from Kalam, a handwritten font too. */
  @font-face { font-family: "Gaegu FR"; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/gaegu/v23/TuGfUVB6Up9NU5ZMq9kRystl.woff2) format("woff2"); unicode-range: U+0000-00BF, U+2000-206F, U+20AC; }
  @font-face { font-family: "Gaegu FR"; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/gaegu/v23/TuGSUVB6Up9NU573jsw86MZPBV0w.woff2) format("woff2"); unicode-range: U+0000-00BF, U+2000-206F, U+20AC; }
  @font-face { font-family: "Gaegu FR"; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8XsLLubg58w.woff2) format("woff2"); unicode-range: U+00C0-00FF, U+0152-0153; }
  @font-face { font-family: "Gaegu FR"; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8XsLLubg58w.woff2) format("woff2"); unicode-range: U+00C0-00FF, U+0152-0153; }
  @font-face { font-family: "Gaegu FR"; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8UMLLubg58xGL.woff2) format("woff2"); unicode-range: U+0100-0151, U+0154-024F; }
  @font-face { font-family: "Gaegu FR"; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8UMLLubg58xGL.woff2) format("woff2"); unicode-range: U+0100-0151, U+0154-024F; }
  @font-face { font-family: "Gaegu FR"; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/kalam/v18/YA9dr0Wd4kDdMthQOCfhsCkAj7g.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: "Gaegu FR"; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/kalam/v18/YA9Qr0Wd4kDdMtDqHTLNkiQqtbGstvY.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+A830-A839, U+A8E0-A8FF; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87a4ad; }
  /* No scrolling, zooming or text selection while tapping on a phone. */
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  /* While the game loads: the yellow bird flapping and bobbing in the sky. Its 8
     frames are stacked and shown one after another by fading them in and out
     (opacity and transform animations keep playing while the page is busy). */
  #loading-bird { position: fixed; left: 50%; top: 50%; z-index: 2; pointer-events: none;
    width: calc(22vmin * 176 / 216); height: 22vmin; margin: -11vmin 0 0 calc(-11vmin * 176 / 216);
    animation: bob 0.9s ease-in-out infinite alternate; will-change: transform; }
  #loading-bird span { position: absolute; inset: 0; transform: scaleX(-1); opacity: 0;
    background: url(../resized-assets/background-assets/yellow-bird.png) no-repeat; background-size: 900% 100%;   /* the strip has 9 frames; the first 8 are used */
    animation: flap 1s linear infinite; will-change: opacity; }
  #loading-bird span:first-child { opacity: 1; }   /* a still bird if the animation can't run */
  @keyframes flap { 0%, 12.4% { opacity: 1; } 12.5%, 100% { opacity: 0; } }
  @keyframes bob { from { transform: translateY(-2vmin); } to { transform: translateY(2vmin); } }
  /* The full screen button, top right, drawn like the game's buttons. Only on
     phones and tablets, and not once the game already fills the screen. */
  #full {
    position: fixed; z-index: 10; display: none;
    top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    font: bold 17px "Gaegu FR", sans-serif; color: #4f6ff0; background: #f6ecf0;
    border: 2.5px solid #676b6e; border-radius: 16px 6px 14px 7px; padding: 3px 12px 5px;
    transform: rotate(2deg); touch-action: manipulation;
  }
  #full:active { transform: rotate(2deg) scale(0.94); }
  @media (pointer: coarse) { #full.show { display: block; } }
  /* On an iPhone, Safari can't go full screen: how to add it to the home screen. */
  #home-hint {
    position: fixed; inset: 0; z-index: 11; display: none; align-items: center; justify-content: center;
    background: rgba(22, 33, 58, 0.55); padding: 20px;
  }
  #home-hint.show { display: flex; }
  #home-hint p {
    max-width: 340px; margin: 0; padding: 16px 20px; text-align: center;
    font: 20px/1.3 "Gaegu FR", sans-serif; color: #16213a; background: #f6ecf0;
    border: 2.5px solid #676b6e; border-radius: 22px 8px 20px 9px; transform: rotate(-1deg);
  }
  /* The first screen: the languages, under the loading bird. */
  #lang {
    position: fixed; left: 0; right: 0; top: calc(50% + 15vmin); z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; padding: 0 16px;
  }
  #lang.gone { display: none; }
  #lang button {
    font: bold clamp(17px, 3.6vmin, 26px) "Gaegu FR", sans-serif; color: #4f6ff0; background: #f6ecf0;
    border: 2.5px solid #676b6e; border-radius: 18px 7px 16px 8px; padding: 4px 22px 7px;
    transform: rotate(-2deg); touch-action: manipulation; cursor: pointer;
  }
  #lang button:nth-child(even) { transform: rotate(2deg); border-radius: 7px 18px 8px 16px; }
  #lang button:active { scale: 0.94; }
</style>
</head>
<body>
<div id="loading-bird"></div>
<div id="lang"></div>
<button id="full" type="button">full screen</button>
<div id="home-hint"><p>To play full screen, tap <b>Share</b>, then <b>Add to Home Screen</b>.<br>Then open 3steps 2gether from your home screen.<br><br><small>(tap to close)</small></p></div>
<script src="texts.js?v=1"></script>
<script>
  // The language, before anything else: one button per language in texts.js,
  // and the game waits for window.LANG. ?lang=fr (or any code there) in the
  // address skips the question.
  (() => {
    const box = document.getElementById("lang");
    const choose = lang => {
      const T = BusTexts[lang];
      window.LANG = lang;
      document.documentElement.lang = lang === "leb" ? "apc-Latn" : lang;
      box.classList.add("gone");
      document.getElementById("full").textContent = T.full;
      document.querySelector("#home-hint p").innerHTML = T.hint;
      document.fonts.load('bold 20px "Gaegu FR"', T.welcome("", "", "", "") + T.nextBus);   // its letters, before the game draws them
    };
    for (const [lang, T] of Object.entries(BusTexts)) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = T.name;
      for (const type of ["touchstart", "mousedown"]) b.addEventListener(type, e => e.stopPropagation());
      b.addEventListener("click", () => choose(lang));
      box.appendChild(b);
    }
    const asked = new URLSearchParams(location.search).get("lang");
    if (BusTexts[asked]) choose(asked);
  })();
</script>
<script>
  // Full screen: iPad, Android and computers can; iPhone Safari can't, so there
  // the button explains how to add the game to the home screen, where it opens
  // without Safari's bars. The game grabs every touch on the page (and cancels
  // it), so these keep their touches to themselves.
  (() => {
    const button = document.getElementById("full"), hint = document.getElementById("home-hint");
    const page = document.documentElement;
    const goFull = page.requestFullscreen || page.webkitRequestFullscreen;
    const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;
    const standalone = navigator.standalone || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
    const update = () => button.classList.toggle("show", !standalone && !isFull());
    for (const el of [button, hint]) for (const type of ["touchstart", "mousedown"]) el.addEventListener(type, e => e.stopPropagation());
    button.addEventListener("click", () => {
      const showHint = () => hint.classList.add("show");
      if (!goFull) { showHint(); return; }
      try { goFull.call(page)?.catch?.(showHint); } catch { showHint(); }   // refused: the hint instead
    });
    hint.addEventListener("click", () => hint.classList.remove("show"));
    document.addEventListener("fullscreenchange", update);
    document.addEventListener("webkitfullscreenchange", update);
    update();
  })();
</script>
<script>
  // The 8 frames of the bird, one after another, 8 a second.
  for (let i = 0; i < 8; i++) {
    const f = document.createElement("span");
    f.style.backgroundPosition = `${i / 8 * 100}% 0`;
    f.style.animationDelay = `${i / 8 - 1}s`;   // frame i shows from i/8 s into each second
    document.getElementById("loading-bird").appendChild(f);
  }
</script>

</body>
</html>

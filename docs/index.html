<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the bus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Clouds behind everything. They drift while the bus drives. -->
<pre class="sky" id="sky" aria-hidden="true"></pre>

<!-- THE STOP: also shown once you got off -->
<pre class="stop-scene" id="stop-scene" aria-hidden="true" hidden></pre>

<main id="stop" class="page" hidden>
  <p id="stop-status" hidden>the bus is full. you keep your place in the queue</p>
  <pre class="board" id="board" role="timer" aria-label="wait until the next stop"></pre>
  <button type="button" id="skip">[ next ]</button>
  <pre class="ticket" id="stop-ticket" hidden></pre>
  <button type="button" class="notify" hidden>[ tell me when my stop is next ]</button>
</main>

<!-- THE BUS -->
<main id="bus" class="bus" hidden>
  <div class="top">
    <p class="notice" id="your-stop" role="status" hidden>!! your stop is next. you get off when the bus stops !!</p>
    <p class="clock"><span>next stop in <span id="bus-time"></span></span></p>
    <ol class="log" id="log" aria-live="polite"></ol>
  </div>
  <section class="scene" aria-label="the bus on the road">
    <pre class="vehicle" id="vehicle"></pre>
    <pre class="road" id="road"></pre>
  </section>
  <div class="controls">
    <button type="button" id="trigger"></button>
    <button type="button" class="notify" hidden>[ tell me when my stop is next ]</button>
  </div>
</main>

<!-- OFF THE BUS -->
<main id="off" hidden>
  <pre class="ticket ticket-memories" id="memories-ticket"></pre>
</main>

<script type="module" src="client.js"></script>
</body>
</html>
